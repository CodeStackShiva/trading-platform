services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "Str0ng!Passw0rd" }
    ports: ["1433:1433"]
  mssql-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on: [mssql]
    restart: "no"
    command: >
      bash -c "until /opt/mssql-tools/bin/sqlcmd -S mssql -U sa -P 'Str0ng!Passw0rd'
      -Q \"IF DB_ID('orders') IS NULL CREATE DATABASE orders\"; do sleep 3; done"
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  order-service:
    build: { context: ., dockerfile: order-service/Dockerfile }
    depends_on: { mssql-init: { condition: service_completed_successfully }, kafka: { condition: service_started } }
    restart: on-failure
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:sqlserver://mssql:1433;databaseName=orders;encrypt=false
      DB_USER: sa
      DB_PASSWORD: "Str0ng!Passw0rd"
      KAFKA_BOOTSTRAP: kafka:9092
  risk-service:
    build: { context: ., dockerfile: risk-service/Dockerfile }
    depends_on: [kafka]
    restart: on-failure
    ports: ["8081:8081"]
    environment: { KAFKA_BOOTSTRAP: "kafka:9092" }
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.2.0
    volumes: ["./observability/grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["3000:3000"]
    depends_on: [prometheus]
