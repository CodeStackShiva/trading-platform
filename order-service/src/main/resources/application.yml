server:
  port: 8080
  shutdown: graceful
spring:
  application.name: order-service
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=orders;encrypt=false}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:Str0ng!Passw0rd}
    hikari: { maximum-pool-size: 20, minimum-idle: 5 }
  jpa:
    open-in-view: false
    hibernate.ddl-auto: none        # schema owned by Flyway
    properties.hibernate.jdbc.batch_size: 50
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      compression-type: lz4
      batch-size: 65536
      properties: { enable.idempotence: true, linger.ms: 5 }
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  metrics:
    tags.application: ${spring.application.name}
    distribution.percentiles-histogram.http.server.requests: true
outbox.poll-ms: 200
