name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: maven }
      - run: mvn -B verify
      - name: Build images
        run: |
          docker build -f order-service/Dockerfile -t order-service:${{ github.sha }} .
          docker build -f risk-service/Dockerfile  -t risk-service:${{ github.sha }} .
      # Next stages (add for your registry/cluster): push image -> kubectl/helm deploy to staging -> smoke test
